<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BSD;src:url('fonts/big-shoulders-display-latin-wght.woff2');font-weight:100 900}
@font-face{font-family:BSS;src:url('fonts/big-shoulders-stencil-display-latin-wght.woff2');font-weight:100 900}
@font-face{font-family:Bitter;src:url('fonts/bitter-latin-wght.woff2');font-weight:100 900}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:radial-gradient(700px 420px at 85% 110%,rgba(220,141,80,.4),transparent 70%),radial-gradient(500px 300px at 10% 0%,rgba(174,203,92,.08),transparent 70%),#0e0c0b;color:#f2e9da;font-family:Bitter}
.rail{position:absolute;left:0;right:0;height:14px;background:radial-gradient(circle at 40% 35%,#a49482 0 1px,#5c5249 1.6px 3px,#221e1b 3.6px,transparent 4.4px) 0 50%/36px 14px repeat-x}
.top{top:24px}.bot{bottom:24px}
.wrap{position:absolute;inset:70px 80px;display:grid;grid-template-columns:1fr 300px;align-items:center;gap:40px}
.k{font-family:BSS;font-weight:800;font-size:26px;letter-spacing:.24em;color:#dc8d50;text-transform:uppercase;margin:0 0 18px}
h1{font-family:BSD;font-weight:900;font-size:138px;line-height:.82;text-transform:uppercase;margin:0}
h1 span{color:#dc8d50}
p.l{font-size:26px;color:#bdb1a1;margin:26px 0 0}
.mark{display:block;width:300px;height:300px}
.ghost{position:absolute;right:-30px;bottom:-60px;font-family:BSD;font-weight:900;font-size:300px;color:transparent;-webkit-text-stroke:1.5px rgba(220,141,80,.18);text-transform:uppercase;line-height:1}
.b{position:absolute;border:2px solid rgba(251,244,230,.28);border-radius:50%}
</style></head><body>
<div class="ghost">Ironwood</div>
<div class="rail top"></div><div class="rail bot"></div>
<span class="b" style="left:640px;top:420px;width:14px;height:14px"></span><span class="b" style="left:690px;top:330px;width:9px;height:9px"></span><span class="b" style="left:610px;top:250px;width:20px;height:20px"></span><span class="b" style="left:720px;top:160px;width:11px;height:11px"></span>
<div class="wrap"><div><p class="k">Ironwood Brewing Co. · Wrenford, Ohio</p><h1>Brewed in a foundry.<br><span>Poured by the river.</span></h1><p class="l">Small-batch beer and a taproom in an 1888 stove works.</p></div>
<img class="mark" src="mark.svg" alt=""></div>
</body></html>
