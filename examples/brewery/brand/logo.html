<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BSD;src:url('fonts/big-shoulders-display-latin-wght.woff2');font-weight:100 900}
@font-face{font-family:BSS;src:url('fonts/big-shoulders-stencil-display-latin-wght.woff2');font-weight:100 900}
html,body{margin:0;width:512px;height:512px;background:#0c0b0a;overflow:hidden}
body{display:grid;place-items:center;align-content:center;gap:6px;background:radial-gradient(circle at 50% 40%,#2a211a,#0c0b0a 70%)}
.mark{display:block;width:300px;height:300px}
.n{font-family:BSD;font-weight:900;font-size:86px;letter-spacing:.06em;color:#f2e9da;line-height:.9;text-transform:uppercase}
.s{font-family:BSS;font-weight:800;font-size:22px;letter-spacing:.3em;color:#dc8d50;text-align:center;text-transform:uppercase}
</style></head><body><img class="mark" src="mark.svg" alt=""><div class="n">Ironwood</div><div class="s">Brewing Co.</div></body></html>
