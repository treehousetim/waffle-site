<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Archivo'; src: url('../src/assets/fonts/archivo-latin-wdth.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'JBM'; src: url('../src/assets/fonts/jetbrains-mono-latin-wght.woff2') format('woff2'); font-weight: 100 800; }
html, body { margin: 0; width: 512px; height: 512px; }
body { display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #12181f, #050607 70%); }
.wrap { display: grid; justify-items: center; gap: 22px; }
img { width: 250px; height: 250px; filter: drop-shadow(0 18px 40px rgba(46,230,255,.18)); }
.name { font-family: 'Archivo'; font-weight: 900; font-stretch: 125%; font-size: 46px; letter-spacing: .02em; text-transform: uppercase; line-height: .9; text-align: center;
  background: linear-gradient(176deg, #fff 0%, #dde5ec 30%, #9aa7b4 50%, #f3f6f9 56%, #b4bfc9 80%, #eef2f6 100%); -webkit-background-clip: text; color: transparent; }
.sub { font-family: 'JBM'; font-size: 17px; letter-spacing: .32em; color: #2ee6ff; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <img src="mark.svg" alt="">
  <div class="name">Gloss<br>Theory</div>
  <div class="sub">Mobile detailing</div>
</div>
</body>
</html>
