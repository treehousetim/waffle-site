<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Archivo'; src: url('../src/assets/fonts/archivo-latin-wdth.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'JBM'; src: url('../src/assets/fonts/jetbrains-mono-latin-wght.woff2') format('woff2'); font-weight: 100 800; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: #050607; color: #eef3f7; font-family: 'Archivo'; }
.photo { position: absolute; inset: 0; background: url('../src/assets/photos/sedan-silhouette.jpg') 70% 70% / cover no-repeat; }
.photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,6,7,.95) 0%, rgba(5,6,7,.7) 45%, rgba(5,6,7,0) 80%), linear-gradient(0deg, rgba(5,6,7,.9), rgba(5,6,7,0) 40%); }
.lights { position: absolute; top: 40px; left: 50%; width: 760px; transform: translateX(-50%) perspective(600px) rotateX(58deg); display: grid; gap: 30px; }
.lights span { height: 6px; border-radius: 3px; background: linear-gradient(90deg, transparent, #fff 15%, #fff 85%, transparent); box-shadow: 0 0 30px 6px rgba(220,245,255,.35); }
.content { position: absolute; left: 72px; right: 72px; bottom: 64px; }
.brand { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
.brand img { width: 64px; height: 64px; }
.brand .n { font-weight: 900; font-stretch: 125%; font-size: 26px; letter-spacing: .06em; text-transform: uppercase; }
.brand .d { font-family: 'JBM'; font-size: 13px; letter-spacing: .3em; color: #2ee6ff; text-transform: uppercase; margin-top: 6px; }
h1 { margin: 0; max-width: 900px; font-size: 84px; line-height: .9; font-weight: 900; font-stretch: 125%; text-transform: uppercase; letter-spacing: -.01em;
  background: linear-gradient(176deg, #fff 0%, #dde5ec 30%, #9aa7b4 48%, #f3f6f9 54%, #b4bfc9 78%, #eef2f6 100%); -webkit-background-clip: text; color: transparent; }
.meta { display: flex; gap: 28px; margin-top: 34px; font-family: 'JBM'; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; color: #a6b1bc; }
.meta b { color: #2ee6ff; font-weight: 500; }
.line { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #0aa9c4, #2ee6ff, #fff); }
</style>
</head>
<body>
<div class="photo"></div>
<div class="lights"><span></span><span></span><span></span></div>
<div class="content">
  <div class="brand"><img src="mark.svg" alt=""><div><div class="n">Gloss Theory</div><div class="d">Mobile detailing</div></div></div>
  <h1>Showroom gloss, in your driveway</h1>
  <div class="meta"><span><b>●</b> Port Alder</span><span>Own water · own power</span><span>(541) 555-0174</span></div>
</div>
<div class="line"></div>
</body>
</html>
