<!doctype html>
<!-- public/og-default.png, 1200x630: the default link preview, a magazine cover. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f4efe6; color: #16130f; }
body { display: grid; grid-template-columns: 1fr 470px; }
.text { display: grid; align-content: space-between; padding: 54px 60px 50px; border-right: 1px solid #16130f; }
.top { display: flex; align-items: center; gap: 18px; font: 500 14px/1 'Jost'; letter-spacing: 0.26em; text-transform: uppercase; }
.top svg { width: 40px; }
.frame, .vale { fill: none; stroke: #16130f; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sun { fill: #8c2f1e; }
h1 { margin: 0; font: 450 104px/0.9 'Bodoni Moda'; letter-spacing: -0.035em; }
h1 em { display: block; font-weight: 400; color: #8c2f1e; }
.foot { display: flex; justify-content: space-between; font: 500 13px/1 'Jost'; letter-spacing: 0.24em; text-transform: uppercase; color: #5b544a; }
.photo { position: relative; background: url('../src/assets/photos/coast-sea-stacks-walk.jpg') 62% 50% / cover; }
.photo span { position: absolute; left: 22px; bottom: 20px; color: #f4efe6; font: italic 400 19px/1.3 'Bodoni Moda'; text-shadow: 0 1px 8px rgb(0 0 0 / 0.5); }
</style></head><body>
<div class="text">
  <div class="top"><svg viewBox="0 0 40 52"><path class="frame" d="M31 47V21a11 11 0 0 0-22 0v23c0 5.2-3.6 6.9-6.6 5.4"/><path class="vale" d="M9 31.5c5 1.4 8.6 5.6 11 10.5 2.4-4.9 6-9.1 11-10.5"/><circle class="sun" cx="20" cy="27.5" r="3.4"/></svg>Juniper &amp; Vale Photography</div>
  <h1>Love stories, <em>told slowly.</em></h1>
  <div class="foot"><span>Weddings · Elopements · Portraits</span><span>The Saltgrass Coast</span></div>
</div>
<div class="photo"><span>Gull Rock, the evening of the vows.</span></div>
</body></html>
