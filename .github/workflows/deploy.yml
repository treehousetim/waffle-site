name: Release

# Releases only. Nothing builds from a branch push. The workflow builds the
# release and attaches it to the GitHub release; the server finds it there
# and deploys it (docs/pull-based-deployments.md). Nothing here can reach the
# server, and there are no secrets.
on:
  release:
    types: [published]

# One build per tag. A re-run of the same tag waits for the one in progress.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

# Every action is pinned to a commit (the major version is in the comment,
# when this template was written). A tag can be moved by whoever controls the
# action's repository; a commit cannot, and what this builds runs on the
# production server. Re-pin deliberately, never to a moving tag.

jobs:
  build:
    name: Build ${{ github.event.release.tag_name }}
    # The template's own repository publishes releases too (semver) and has no
    # server: never build one there. In a project started from it this is
    # always true. tools/rename-project.sh leaves this line alone because it
    # names treehousetim/waffle-site.
    if: github.repository != 'treehousetim/waffle-site'
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # The tag is text somebody typed. Only a plain release number goes
      # further. Read through the environment, never spliced into a script
      # with ${{ }}.
      # -------------------------------------------------------------------
      - name: Refuse anything but a release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[1-9][0-9]*$ ]]; then
            echo "::error::release tag is not vN (docs/releasing.md); refusing to build it"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # No token is left in .git for anything later to find.
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # -------------------------------------------------------------------
      # Where the site lives and which waffle app it fronts, from the one
      # place each is written (docker-compose.prod.yml). Neither is secret.
      # -------------------------------------------------------------------
      - name: Read the hostnames
        run: |
          set -euo pipefail
          host="$(sed -n 's/^ *SITE_ADDRESS: *//p' docker-compose.prod.yml | tr -d '"' | head -n 1)"
          app="$(sed -n 's/^ *WAFFLE_APP_URL: *//p' docker-compose.prod.yml | tr -d '"' | head -n 1)"
          [ -n "$host" ] || { echo "::error::no SITE_ADDRESS in docker-compose.prod.yml"; exit 1; }
          [ -n "$app" ] || { echo "::error::no WAFFLE_APP_URL in docker-compose.prod.yml"; exit 1; }
          echo "SITE_URL=https://$host" >> "$GITHUB_ENV"
          echo "WAFFLE_APP_URL=$app" >> "$GITHUB_ENV"

      # -------------------------------------------------------------------
      # npm runs only in containers (docs/supply-chain.md). This one sees the
      # three package files and an empty node_modules, nothing else: npm ci
      # installs exactly the lockfile, checking every package against its
      # recorded hash, with install scripts off (.npmrc), then the registry
      # signatures are verified, before anything is built from them.
      # -------------------------------------------------------------------
      - name: Install the site's packages, in a container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/node_modules"
          docker run --rm \
            -v "$PWD/package.json:/app/package.json:ro" \
            -v "$PWD/package-lock.json:/app/package-lock.json:ro" \
            -v "$PWD/.npmrc:/app/.npmrc:ro" \
            -v "$RUNNER_TEMP/node_modules:/app/node_modules" \
            -w /app -e NPM_CONFIG_IGNORE_SCRIPTS=true \
            node:26 sh -euc 'npm ci; npm audit signatures'

      # -------------------------------------------------------------------
      # The build, in a container that reads the tree and cannot change it:
      # it copies the tree into its own filesystem, builds there, and only
      # dist/ comes out. It keeps its network, because a production build
      # reads the waffle app's live data (its public read endpoints, which
      # need no key); there is nothing on it to take.
      #
      # A production build: indexable, canonical URLs on SITE_URL. `npm run
      # build` type-checks, builds, and runs the SEO audit, any of which
      # fails the release here.
      # -------------------------------------------------------------------
      - name: Build the site, in a container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/node_modules:/app/node_modules" \
            -v "$RUNNER_TEMP/dist:/out" \
            -w /app \
            -e SITE_ENV=production -e SITE_URL -e WAFFLE_APP_URL -e SITE_RELEASE="$TAG" \
            -e ASTRO_TELEMETRY_DISABLED=1 -e NPM_CONFIG_IGNORE_SCRIPTS=true \
            node:26 sh -euc 'tar -C /src --exclude=./.git --exclude=./node_modules -cf - . | tar -C /app -xf -; npm run build; cp -R dist/. /out/'

      # Only plain files and directories, and the pages every site has. Then
      # build.txt, which names the release: the server checks it is serving
      # it, and a rebuild checks what the server is serving.
      - name: Take only the built site
        run: |
          set -euo pipefail
          odd="$(find "$RUNNER_TEMP/dist" ! -type f ! -type d)"
          if [ -n "$odd" ]; then
            echo "::error::the build left something that is not a plain file: $odd"
            exit 1
          fi
          for required in index.html 404.html robots.txt sitemap-index.xml; do
            [ -f "$RUNNER_TEMP/dist/$required" ] || { echo "::error::the build made no $required"; exit 1; }
          done
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/dist/build.txt"

      # -------------------------------------------------------------------
      # The release: the tag's own server files (the Compose files, the
      # Caddyfile, deploy/), which nothing above could change, and the built
      # site. Nothing else is shipped.
      # -------------------------------------------------------------------
      - name: Pack the release
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release"
          mkdir -p "$stage/docker/caddy"
          cp docker-compose.yml docker-compose.prod.yml VERSION "$stage/"
          cp docker/caddy/Caddyfile "$stage/docker/caddy/"
          cp -R deploy "$stage/deploy"
          cp -R "$RUNNER_TEMP/dist" "$stage/dist"
          tar -C "$stage" -czf "waffle_site-${TAG}.tar.gz" .
          sha256sum "waffle_site-${TAG}.tar.gz" > "waffle_site-${TAG}.tar.gz.sha256"

      - name: Hand the release to the attach job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: |
            waffle_site-${{ env.TAG }}.tar.gz
            waffle_site-${{ env.TAG }}.tar.gz.sha256
          retention-days: 3

  # -------------------------------------------------------------------------
  # Attach: the only job that can write, and it runs nothing but the
  # checksum and the upload. The files are uploaded by the workflow's own
  # bot, which is the only uploader the server trusts.
  # -------------------------------------------------------------------------
  attach:
    name: Attach ${{ github.event.release.tag_name }}
    needs: build
    # Skipped with build in the template's own repository anyway; said again
    # so no edit to build's condition can let this job run there.
    if: github.repository != 'treehousetim/waffle-site'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Take the release from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release

      - name: Attach it to the GitHub release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[1-9][0-9]*$ ]] || { echo "::error::release tag is not vN"; exit 1; }
          sha256sum -c "waffle_site-${TAG}.tar.gz.sha256"
          gh release upload "$TAG" "waffle_site-${TAG}.tar.gz" "waffle_site-${TAG}.tar.gz.sha256" --clobber
